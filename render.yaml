# Blueprint do Render para o Kaption Scheduler (opcional: dá para criar pelo painel).
# Use com um repositório que tenha o conteúdo desta pasta `server/` na raiz.
services:
  - type: web
    name: kaption-scheduler
    runtime: docker
    plan: starter            # pago: o gratuito dorme e perde a fila
    healthCheckPath: /health
    disk:
      name: kaption-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: KAPTION_TOKEN
        generateValue: true  # o Render gera; copie para a extensão
      - key: EVOLUTION_URL
        sync: false          # o Render pede o valor na criação
      - key: EVOLUTION_API_KEY
        sync: false
      # EVOLUTION_INSTANCE é opcional: sem ela, usa a única instância conectada.
      - key: TZ
        value: America/Sao_Paulo
